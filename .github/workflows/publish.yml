# Build the package and publish it to PyPI when a version tag is pushed (for example v0.0.1).
# PyPI authenticates the upload through "trusted publishing": no token is stored anywhere.
# Set it up once on PyPI: Your projects > Publishing > Add a new pending publisher, with
# this repository, the workflow name "publish.yml", and the environment name "pypi".
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
